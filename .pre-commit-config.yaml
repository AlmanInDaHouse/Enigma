# Pre-commit hooks para Enigma
# Ejecutar manualmente: `uv run pre-commit run --all-files`
# Instalar como git hook: `uv run pre-commit install`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # mypy corre en un entorno aislado: hay que listar aquí todas las
        # dependencias que el código de src/ importa (de lo contrario salen
        # errores `import-not-found` aunque .venv tenga los paquetes).
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - typer>=0.12
          - types-PyYAML>=6.0
        args: ["--config-file", "pyproject.toml"]
        # pasa sólo el código de producción al type-checker
        files: ^src/
