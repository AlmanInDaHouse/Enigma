name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Black format check
        run: uv run black --check src tests

      - name: Mypy type-check
        run: uv run mypy src

      - name: Pytest
        # --cov-fail-under=0 while the test suite is empty (Phase 0).
        # Raise to 70 once T-101+ land real tests (see CLAUDE.md, DoD).
        run: uv run pytest --cov=enigma --cov-report=term-missing --cov-fail-under=0
